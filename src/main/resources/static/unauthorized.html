<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>역발행 시스템 - 인증 필요</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    font-family: '맑은 고딕', Malgun Gothic, sans-serif;
    background: #f0f4f8; height: 100vh;
    display: flex; align-items: center; justify-content: center;
}
.card {
    background: #fff; border-radius: 12px; border: 1px solid #e2e8f0;
    padding: 56px; text-align: center; max-width: 480px; width: 100%; aspect-ratio: 1.5 / 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
}
.icon { font-size: 48px; margin-bottom: 16px; }
h1 { font-size: 20px; font-weight: 700; color: #1a3a6e; margin-bottom: 8px; }
p { font-size: 14px; color: #6b7280; line-height: 1.6; }
</style>
</head>
<body>
<div class="card">
    <div class="icon">🔒</div>
    <h1>접근 권한이 없습니다</h1>
    <p>이 페이지는 포털 SSO 인증 후에만 접근할 수 있습니다.<br>포털을 통해 다시 접속해 주세요.</p>
</div>
</body>
</html>
