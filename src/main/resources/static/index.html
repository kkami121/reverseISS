<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>세금계산서 역발행</title>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; }
        h2 { margin-bottom: 8px; }
        h3 { margin: 24px 0 8px; color: #333; border-bottom: 1px solid #ddd; padding-bottom: 4px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
        label { display: block; margin-top: 10px; font-size: 13px; color: #555; }
        input { width: 100%; padding: 7px; margin-top: 3px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; }
        .item-block { border: 1px solid #ddd; border-radius: 6px; padding: 12px; margin-top: 10px; position: relative; }
        .item-block h4 { margin: 0 0 8px; font-size: 14px; }
        .remove-btn { position: absolute; top: 10px; right: 10px; background: #ef4444; color: #fff; border: none; border-radius: 4px; padding: 4px 10px; cursor: pointer; font-size: 12px; }
        .add-btn { margin-top: 10px; padding: 8px 20px; background: #6b7280; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; }
        .submit-btn { margin-top: 24px; padding: 12px 40px; background: #2563eb; color: #fff; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; display: block; width: 100%; }
        .submit-btn:hover { background: #1d4ed8; }
        #result { margin-top: 20px; padding: 16px; background: #f1f5f9; border-radius: 6px; white-space: pre-wrap; font-size: 13px; display: none; }
    </style>
</head>
<body>

    <h3>기타</h3>

        <div>
            <label>장부번호1 (BOOK_NO1)</label>
            <input id="bookNo1" value="001">
        </div>

    <h3>품목 목록 (IT_ITEMLIST)</h3>
    <div id="itemList"></div>
    <button class="add-btn" onclick="addItem()">+ 품목 추가</button>

    <button class="submit-btn" onclick="issue()">세금계산서 발행</button>
    <div id="result"></div>

    <script>
        let itemCount = 0;

        function addItem() {
            itemCount++;
            const div = document.createElement('div');
            div.className = 'item-block';
            div.id = 'item-' + itemCount;
            div.innerHTML = `
                <h4>품목 ${itemCount}</h4>
                <button class="remove-btn" onclick="removeItem(${itemCount})">삭제</button>
                <div class="grid">
                    <div><label>ERP_USER_MAKE_ID</label><input class="i-erpUserMakeId" value="202410150003"></div>
                    <div><label>DETAIL_NO</label><input class="i-detailNo" value="1"></div>
                    <div><label>YEAR</label><input class="i-year" value="2026"></div>
                    <div><label>MONTH</label><input class="i-month" value="03"></div>
                    <div><label>DAY</label><input class="i-day" value="08"></div>
                    <div><label>ARTICLE_NM</label><input class="i-articleNm" value="테스트 품목"></div>
                    <div><label>STANDARD</label><input class="i-standard" value=""></div>
                    <div><label>QUANTITY</label><input class="i-quantity" value=""></div>
                    <div><label>UNIT_AMT</label><input class="i-unitAmt" value=""></div>
                    <div><label>SUPPLY_AMT</label><input class="i-supplyAmt" value="1000"></div>
                    <div><label>TAX_AMT</label><input class="i-taxAmt" value="100"></div>
                    <div><label>BIGO</label><input class="i-bigo" value="품목테스트"></div>
                </div>
            `;
            document.getElementById('itemList').appendChild(div);
        }

        function removeItem(id) {
            document.getElementById('item-' + id).remove();
        }

        function val(id) { return document.getElementById(id).value; }

        async function issue() {
            const items = [];
            document.querySelectorAll('.item-block').forEach(block => {
                items.push({
                    erpUserMakeId: block.querySelector('.i-erpUserMakeId').value,
                    detailNo:    block.querySelector('.i-detailNo').value,
                    year:        block.querySelector('.i-year').value,
                    month:       block.querySelector('.i-month').value,
                    day:         block.querySelector('.i-day').value,
                    articleNm:   block.querySelector('.i-articleNm').value,
                    standard:    block.querySelector('.i-standard').value,
                    quantity:    block.querySelector('.i-quantity').value,
                    unitAmt:     block.querySelector('.i-unitAmt').value,
                    supplyAmt:   block.querySelector('.i-supplyAmt').value,
                    taxAmt:      block.querySelector('.i-taxAmt').value,
                    bigo:        block.querySelector('.i-bigo').value,
                });
            });

            const body = {
                corpBizNo:        val('corpBizNo'),
                erpUserMakeId:    val('erpUserMakeId'),
                documentType:     val('documentType'),
                modReason:        val('modReason'),
                oriIssueId:       val('oriIssueId'),
                taxType:          val('taxType'),
                makeDate:         val('makeDate'),
                tranType:         val('tranType'),
                cashAmt:          val('cashAmt'),
                checkAmt:         val('checkAmt'),
                billAmt:          val('billAmt'),
                uncollectAmt:     val('uncollectAmt'),
                taxAmt:           val('taxAmt'),
                supplyAmt:        val('supplyAmt'),
                totalAmt:         val('totalAmt'),
                compRegisterNo:   val('compRegisterNo'),
                compSubId:        val('compSubId'),
                compName:         val('compName'),
                compRepresent:    val('compRepresent'),
                compBizState:     val('compBizState'),
                compBizCategory:  val('compBizCategory'),
                compZipCode:      val('compZipCode'),
                compAddress1:     val('compAddress1'),
                compAddress2:     val('compAddress2'),
                memberNm:         val('memberNm'),
                memberTelNo1:     val('memberTelNo1'),
                memberTelNo2:     val('memberTelNo2'),
                memberTelNo3:     val('memberTelNo3'),
                memberEmail:      val('memberEmail'),
                memberPost:       val('memberPost'),
                custKind:         val('custKind'),
                custRegisterNo:   val('custRegisterNo'),
                custSubId:        val('custSubId'),
                custName:         val('custName'),
                custRepresent:    val('custRepresent'),
                custBizState:     val('custBizState'),
                custBizCategory:  val('custBizCategory'),
                custZipCode:      val('custZipCode'),
                custAddress1:     val('custAddress1'),
                custAddress2:     val('custAddress2'),
                managerNm:        val('managerNm'),
                managerTelNo1:    val('managerTelNo1'),
                managerTelNo2:    val('managerTelNo2'),
                managerTelNo3:    val('managerTelNo3'),
                managerEmail:     val('managerEmail'),
                managerPost:      val('managerPost'),
                manager2Nm:       val('manager2Nm'),
                manager2TelNo1:   val('manager2TelNo1'),
                manager2TelNo2:   val('manager2TelNo2'),
                manager2TelNo3:   val('manager2TelNo3'),
                manager2Email:    val('manager2Email'),
                manager2Post:     val('manager2Post'),
                bigo:             val('bigo'),
                bookNo1:          val('bookNo1'),
                bookNo2:          val('bookNo2'),
                serialNo:         val('serialNo'),
                smsGb:            val('smsGb'),
                items:            items
            };

            const resultDiv = document.getElementById('result');
            resultDiv.style.display = 'block';
            resultDiv.textContent = '요청 중...';

            try {
                const res = await fetch('/reverse/tax-invoice/issue', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                const data = await res.json();
                resultDiv.textContent = JSON.stringify(data, null, 2);
            } catch (e) {
                resultDiv.textContent = '오류: ' + e.message;
            }
        }

        // 기본 품목 1개 추가
        addItem();
    </script>
</body>
</html>
