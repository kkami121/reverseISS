<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>세금계산서 역발행</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: sans-serif; max-width: 900px; margin: 40px auto; padding: 0 20px; background: #f8fafc; }

        /* 탭 */
        .tabs { display: flex; gap: 4px; margin-bottom: 0; }
        .tab-btn {
            padding: 10px 28px; border: 1px solid #ddd; border-bottom: none;
            background: #e2e8f0; cursor: pointer; border-radius: 6px 6px 0 0;
            font-size: 14px; font-weight: 600; color: #64748b;
        }
        .tab-btn.active { background: #fff; color: #2563eb; border-color: #ddd; }

        .tab-content { display: none; background: #fff; border: 1px solid #ddd; border-radius: 0 6px 6px 6px; padding: 24px; }
        .tab-content.active { display: block; }

        h3 { margin: 20px 0 8px; color: #333; border-bottom: 1px solid #eee; padding-bottom: 4px; font-size: 14px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
        label { display: block; margin-top: 10px; font-size: 12px; color: #666; }
        input, select {
            width: 100%; padding: 7px; margin-top: 3px;
            border: 1px solid #ccc; border-radius: 4px; font-size: 13px; background: #fff;
        }

        /* 품목 */
        .item-block { border: 1px solid #e2e8f0; border-radius: 6px; padding: 12px; margin-top: 10px; position: relative; background: #f8fafc; }
        .item-block h4 { margin: 0 0 8px; font-size: 13px; color: #475569; }
        .remove-btn { position: absolute; top: 10px; right: 10px; background: #ef4444; color: #fff; border: none; border-radius: 4px; padding: 3px 10px; cursor: pointer; font-size: 12px; }
        .add-btn { margin-top: 10px; padding: 7px 18px; background: #64748b; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; }

        /* 버튼 */
        .submit-btn {
            margin-top: 24px; padding: 12px; background: #2563eb; color: #fff;
            border: none; border-radius: 6px; font-size: 15px; cursor: pointer; width: 100%; font-weight: 600;
        }
        .submit-btn:hover { background: #1d4ed8; }
        .search-btn {
            margin-top: 20px; padding: 11px; background: #0891b2; color: #fff;
            border: none; border-radius: 6px; font-size: 15px; cursor: pointer; width: 100%; font-weight: 600;
        }
        .search-btn:hover { background: #0e7490; }

        /* 결과 */
        .result-box { margin-top: 16px; padding: 14px; background: #f1f5f9; border-radius: 6px; white-space: pre-wrap; font-size: 12px; display: none; max-height: 300px; overflow-y: auto; }

        /* 조회 결과 테이블 */
        .result-meta { margin-top: 16px; font-size: 13px; color: #475569; display: none; }
        .result-meta span { font-weight: 700; color: #0f172a; }
        .result-table-wrap { margin-top: 10px; overflow-x: auto; display: none; }
        table { border-collapse: collapse; width: 100%; font-size: 12px; }
        th { background: #1e40af; color: #fff; padding: 8px 10px; text-align: left; white-space: nowrap; }
        td { padding: 7px 10px; border-bottom: 1px solid #e2e8f0; white-space: nowrap; }
        tr:hover td { background: #f0f9ff; }
        tr:nth-child(even) td { background: #f8fafc; }
        tr:nth-child(even):hover td { background: #f0f9ff; }
        .badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 600; }
        .badge-success { background: #dcfce7; color: #166534; }
        .badge-fail { background: #fee2e2; color: #991b1b; }
    </style>
</head>
<body>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('issue')">세금계산서 발행</button>
        <button class="tab-btn" onclick="switchTab('list')">세금계산서 조회</button>
        <button class="tab-btn" onclick="switchTab('state')">상태 조회</button>
    </div>

    <!-- ===== 조회 탭 ===== -->

    <!-- ===== 상태 조회 탭 ===== -->
    <div id="tab-state" class="tab-content">

        <h3>조회 조건</h3>
        <div class="grid">
            <div>
                <label>사업자번호 (CORP_BIZ_NO)</label>
                <input id="s-corpBizNo" value="1058111908">
            </div>
            <div>

            </div>
            <div>

                <input id="s-endDate" value="20250131">
            </div>
            <div>
                <label>ERP 사용자 ID (ERP_USER_MAKE_ID)</label>
                <input id="s-erpUserMakeId" value="">
            </div>

    <script>
        // ── 탭 전환
        function switchTab(name) {
            document.querySelectorAll('.tab-btn').forEach((b, i) => {
                b.classList.toggle('active', ['issue','list','state'][i] === name);
            });
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.getElementById('tab-' + name).classList.add('active');
        }

        // ── 발행 탭
        let itemCount = 0;

        function addItem() {
            itemCount++;
            const div = document.createElement('div');
            div.className = 'item-block';
            div.id = 'item-' + itemCount;
            div.innerHTML = `
                <h4>품목 ${itemCount}</h4>
                <button class="remove-btn" onclick="removeItem(${itemCount})">삭제</button>
                <div class="grid">
                    <div><label>ERP_USER_MAKE_ID</label><input class="i-erpUserMakeId" value="202410150003"></div>
                    <div><label>DETAIL_NO</label><input class="i-detailNo" value="1"></div>
                    <div><label>YEAR</label><input class="i-year" value="2026"></div>
                    <div><label>MONTH</label><input class="i-month" value="03"></div>
                    <div><label>DAY</label><input class="i-day" value="08"></div>
                    <div><label>ARTICLE_NM</label><input class="i-articleNm" value="테스트 품목"></div>
                    <div><label>STANDARD</label><input class="i-standard" value=""></div>
                    <div><label>QUANTITY</label><input class="i-quantity" value=""></div>
                    <div><label>UNIT_AMT</label><input class="i-unitAmt" value=""></div>
                    <div><label>SUPPLY_AMT</label><input class="i-supplyAmt" value="1000"></div>
                    <div><label>TAX_AMT</label><input class="i-taxAmt" value="100"></div>
                    <div><label>BIGO</label><input class="i-bigo" value="품목테스트"></div>
                </div>
            `;
            document.getElementById('itemList').appendChild(div);
        }

        function removeItem(id) { document.getElementById('item-' + id).remove(); }
        function val(id) { return document.getElementById(id).value; }

        async function issue() {
            const items = [];
            document.querySelectorAll('.item-block').forEach(block => {
                items.push({
                    erpUserMakeId: block.querySelector('.i-erpUserMakeId').value,
                    detailNo:      block.querySelector('.i-detailNo').value,
                    year:          block.querySelector('.i-year').value,
                    month:         block.querySelector('.i-month').value,
                    day:           block.querySelector('.i-day').value,
                    articleNm:     block.querySelector('.i-articleNm').value,
                    standard:      block.querySelector('.i-standard').value,
                    quantity:      block.querySelector('.i-quantity').value,
                    unitAmt:       block.querySelector('.i-unitAmt').value,
                    supplyAmt:     block.querySelector('.i-supplyAmt').value,
                    taxAmt:        block.querySelector('.i-taxAmt').value,
                    bigo:          block.querySelector('.i-bigo').value,
                });
            });

            const body = {
                corpBizNo: val('corpBizNo'), erpUserMakeId: val('erpUserMakeId'),
                documentType: val('documentType'), modReason: val('modReason'),
                oriIssueId: val('oriIssueId'), targetLevel: val('targetLevel'), taxType: val('taxType'),
                makeDate: val('makeDate'), tranType: val('tranType'),
                cashAmt: val('cashAmt'), checkAmt: val('checkAmt'),
                billAmt: val('billAmt'), uncollectAmt: val('uncollectAmt'),
                taxAmt: val('taxAmt'), supplyAmt: val('supplyAmt'), totalAmt: val('totalAmt'),
                compRegisterNo: val('compRegisterNo'), compSubId: val('compSubId'),
                compName: val('compName'), compRepresent: val('compRepresent'),
                compBizState: val('compBizState'), compBizCategory: val('compBizCategory'),
                compZipCode: val('compZipCode'), compAddress1: val('compAddress1'), compAddress2: val('compAddress2'),
                memberNm: val('memberNm'), memberTelNo1: val('memberTelNo1'),
                memberTelNo2: val('memberTelNo2'), memberTelNo3: val('memberTelNo3'),
                memberEmail: val('memberEmail'), memberPost: val('memberPost'),
                custKind: val('custKind'), custRegisterNo: val('custRegisterNo'),
                custSubId: val('custSubId'), custName: val('custName'),
                custRepresent: val('custRepresent'), custBizState: val('custBizState'),
                custBizCategory: val('custBizCategory'), custZipCode: val('custZipCode'),
                custAddress1: val('custAddress1'), custAddress2: val('custAddress2'),
                managerNm: val('managerNm'), managerTelNo1: val('managerTelNo1'),
                managerTelNo2: val('managerTelNo2'), managerTelNo3: val('managerTelNo3'),
                managerEmail: val('managerEmail'), managerPost: val('managerPost'),
                manager2Nm: val('manager2Nm'), manager2TelNo1: val('manager2TelNo1'),
                manager2TelNo2: val('manager2TelNo2'), manager2TelNo3: val('manager2TelNo3'),
                manager2Email: val('manager2Email'), manager2Post: val('manager2Post'),
                bigo: val('bigo'), bookNo1: val('bookNo1'), bookNo2: val('bookNo2'),
                serialNo: val('serialNo'), smsGb: val('smsGb'), items
            };

            const resultDiv = document.getElementById('issueResult');
            resultDiv.style.display = 'block';
            resultDiv.textContent = '요청 중...';
            try {
                const res = await fetch('/reverse/tax-invoice/issue', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                const data = await res.json();
                resultDiv.textContent = JSON.stringify(data, null, 2);
            } catch (e) {
                resultDiv.textContent = '오류: ' + e.message;
            }
        }

        // ── 조회 탭
        function fmt(n) { return (n ?? 0).toLocaleString(); }

        async function listSearch() {
            const body = {
                CORP_BIZ_NO: val('l-corpBizNo'),
                CATEGORY:    document.getElementById('l-category').value,
                DOC_TYPE:    document.getElementById('l-docType').value,
                ISSUE_TYPE:  document.getElementById('l-issueType').value,
                ITEM_LIST:   document.getElementById('l-itemList').value,
            };

            const meta    = document.getElementById('listMeta');
            const tableWrap = document.getElementById('listTableWrap');
            const rawDiv  = document.getElementById('listRawResult');
            meta.style.display = 'none';
            tableWrap.style.display = 'none';
            rawDiv.style.display = 'block';
            rawDiv.textContent = '조회 중...';

            try {
                const res = await fetch('/reverse/tax-invoice/list', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                const data = await res.json();

                rawDiv.style.display = 'none';

                if (data.result !== 'SUCCESS' || !data.data) {
                    rawDiv.style.display = 'block';
                    rawDiv.textContent = JSON.stringify(data, null, 2);
                    return;
                }

                const d = data.data;
                meta.style.display = 'block';
                meta.innerHTML = `총 <span>${d.ROW_CNT ?? 0}</span>건 조회 (잔여: ${d.ROW_REST_CNT ?? 0}건, 다음 페이지: ${d.IS_NEXT === 'Y' ? '있음' : '없음'})`;

                const tbody = document.getElementById('listBody');
                tbody.innerHTML = '';
                (d.LIST ?? []).forEach((item, idx) => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${idx + 1}</td>
                        <td>${item.MAKE_DD ?? ''}</td>
                        <td>${item.ISSUE_DD ?? ''}</td>
                        <td style="font-size:11px">${item.APPR_NO ?? ''}</td>
                        <td>${item.COMP_NM ?? ''}</td>
                        <td>${item.CUST_NM ?? ''}</td>
                        <td style="text-align:right">${fmt(item.AMT_SUPPLY)}</td>
                        <td style="text-align:right">${fmt(item.AMT_TAX)}</td>
                        <td style="text-align:right"><b>${fmt(item.AMT_TOT)}</b></td>
                        <td>${item.CATEGORY_NM ?? ''}</td>
                        <td>${item.ISSUE_TYPE_NM ?? ''}</td>
                    `;
                    tbody.appendChild(tr);
                });
                tableWrap.style.display = 'block';

            } catch (e) {
                rawDiv.style.display = 'block';
                rawDiv.textContent = '오류: ' + e.message;
            }
        }

        // ── 상태 조회 탭
        async function stateSearch() {
            const body = {
                CORP_BIZ_NO: val('s-corpBizNo'),
                DATA: {
                    DATE_TYPE:       document.getElementById('s-dateType').value,
                    START_DATE:      val('s-startDate'),
                    END_DATE:        val('s-endDate'),
                    ERP_USER_MAKE_ID: val('s-erpUserMakeId'),
                }
            };

            const meta      = document.getElementById('stateMeta');
            const tableWrap = document.getElementById('stateTableWrap');
            const rawDiv    = document.getElementById('stateRawResult');
            meta.style.display = 'none';
            tableWrap.style.display = 'none';
            rawDiv.style.display = 'block';
            rawDiv.textContent = '조회 중...';

            try {
                const res = await fetch('/reverse/tax-invoice/state', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                const data = await res.json();
                rawDiv.style.display = 'none';

                if (data.result !== 'SUCCESS' || !data.data) {
                    rawDiv.style.display = 'block';
                    rawDiv.textContent = JSON.stringify(data, null, 2);
                    return;
                }

                const d = data.data;
                meta.style.display = 'block';
                meta.innerHTML = `총 <span>${d.TOTCNT ?? 0}</span>건 조회`;

                const tbody = document.getElementById('stateBody');
                tbody.innerHTML = '';
                (d.LIST ?? []).forEach((item, idx) => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${idx + 1}</td>
                        <td>${item.ERP_USER_MAKE_ID ?? ''}</td>
                        <td>${item.ISSUE_DATE ?? ''}</td>
                        <td>${item.DOC_STATE ?? ''}</td>
                        <td>${item.DOC_STATE_NM ?? ''}</td>
                        <td>${item.DOC_STATE_DATE ?? ''}</td>
                        <td>${item.RESULT_CODE ?? ''}</td>
                        <td>${item.RESULT_MSG ?? ''}</td>
                        <td>${item.DEL_FLAG ?? ''}</td>
                        <td style="font-size:11px">${item.ISSUE_ID ?? ''}</td>
                    `;
                    tbody.appendChild(tr);
                });
                tableWrap.style.display = 'block';

            } catch (e) {
                rawDiv.style.display = 'block';
                rawDiv.textContent = '오류: ' + e.message;
            }
        }

        // 기본 품목 1개
        addItem();
    </script>
</body>
</html>
