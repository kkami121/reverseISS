spring.application.name=Itemlink
spring.output.ansi.enabled=ALWAYS

spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:192.168.57.7}:${POSTGRES_PORT:5432}/${POSTGRES_DB:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}


server.port=5004
spring.web.resources.cache.period=0
spring.web.resources.cache.cachecontrol.no-cache=true
spring.web.resources.cache.cachecontrol.must-revalidate=true
spring.web.resources.static-locations=classpath:/static/
server.servlet.context-path=/reverse

kaccounting.base-url=https://devea.sw.co.kr
kaccounting.token=${KACCOUNTING_TOKEN}

sso.secret=${SSO_SECRET}
sso.issuer=${SSO_ISSUER}
sso.audience=${SSO_AUDIENCE}
sso.claim-name=${SSO_CLAIM_NAME}
