services:
  app:
    build:
      context: .
    image: reverseiss-app:latest
    container_name: reverseiss-app
    environment:
      SPRING_DATASOURCE_URL: jdbc:log4jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: net.sf.log4jdbc.sql.jdbcapi.DriverSpy
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      KACCOUNTING_TOKEN: ${KACCOUNTING_TOKEN}
    ports:
      - "127.0.0.1:5004:5004"
    restart: always
